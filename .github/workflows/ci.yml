name: CI

on:
  push:
    branches: [develop, main, 'release/**']
  pull_request:

jobs:
  build:
    # The launcher that ends up inside wrapped jars targets Java 11 (maven.compiler.release), so
    # build and test on every LTS from that floor up (docs/SPEC.md, M1).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['11', '17', '21']
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and verify
        run: mvn -B --no-transfer-progress verify

      - name: Upload failure surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: '**/target/*-reports/'
          if-no-files-found: ignore
